name: ci

# Forgejo runs only this directory and ignores .github/workflows. The
# self-hosted runner is Linux-only; macOS and Windows coverage stays in the
# GitHub mirror's .github/workflows/ci.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "gofmt issues:"
            echo "$diff"
            exit 1
          fi

      - name: go test
        run: go test -race ./...

      - name: release-version policy
        run: bash .github/scripts/next-release-tag_test.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
