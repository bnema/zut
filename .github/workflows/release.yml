name: release

# Every morning at 07:00 Europe/Paris, ermite tags main when its unreleased
# conventional commits call for a release, then publishes it in the same run (a
# tag pushed with the job token starts no run). A v* tag pushed by hand also
# publishes. A tag whose release is already published is left untouched, so a
# quiet day stays green and a failed release is retried by the next run. The
# GitHub mirror never tags nor publishes here: it receives the forge's tags and
# github-release.yml publishes a link-only release.
on:
  schedule:
    - cron: "0 7 * * *"
      timezone: Europe/Paris
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name != 'push' && github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Compute the next release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --format=%B | grep -Fq '[release=skip]'; then
            echo "The latest commit requested that the release be skipped."
            exit 0
          fi
          tag=$(bash .github/scripts/next-release-tag.sh)
          if [ -z "$tag" ]; then
            echo "No releasable conventional commits for this run."
            exit 0
          fi
          echo "Releasing $tag from $(git rev-parse --short HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push the tag
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A retry finds the tag already on HEAD and reuses it; the release job
          # publishes it only when its release is not published yet.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "release $TAG"
          git push origin "refs/tags/$TAG"

  release:
    needs: tag
    # Only ermite publishes. A pushed tag publishes there; a scheduled or
    # dispatched run publishes what it tagged. The GitHub mirror gets a
    # link-only release from github-release.yml instead.
    if: >-
      github.server_url != 'https://github.com' &&
      !cancelled() && needs.tag.result != 'failure' &&
      (github.event_name == 'push' || needs.tag.outputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag && format('refs/tags/{0}', needs.tag.outputs.tag) || github.ref }}

      # GoReleaser keeps a release as a draft until every artifact is uploaded:
      # only a missing or draft release needs publishing.
      - name: Check whether the release is already published
        id: publication
        shell: bash
        env:
          TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Same API and repository as github_urls.api and release.github in
          # .goreleaser.yaml: a wrong path would answer 404 and republish daily.
          api=${GITHUB_API_URL:-https://git.bnema.dev/-/github/api}
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          status=$(curl --silent --show-error --retry 3 --retry-connrefused \
            --connect-timeout 10 --max-time 60 \
            --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "${api%/}/repos/bnema/zut/releases/tags/$TAG")
          publish=$(bash .github/scripts/release-needs-publish.sh "$status" "$response")
          if [ "$publish" = false ]; then
            echo "$TAG is already published; nothing to do."
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.publication.outputs.publish == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        if: steps.publication.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
