name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same branch /
# pr, so we don't waste minutes on stale SHAs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ermite has no macOS or Windows runner: those legs run on GitHub only.
        os: ${{ fromJSON(github.server_url == 'https://github.com' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: set up go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        # Windows' bash is mingw; gofmt outputs paths with slashes so the
        # diff check works there too. Skip on windows only if needed.
        if: runner.os != 'Windows'
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "gofmt issues:"
            echo "$diff"
            exit 1
          fi

      - name: go test
        run: go test -race ./...

      # Keep Linux-only quality checks in the Ubuntu test job so CI needs
      # only the three platform runners.
      - name: release-version policy
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/next-release-tag_test.sh

      - name: golangci-lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
